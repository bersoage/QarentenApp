name: Compilar beta

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Renombrar
        run: cp app/build/outputs/apk/release/app-release.apk QarentenApp-beta-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: QarentenApp-beta-${{ github.run_number }}
          path: QarentenApp-beta-${{ github.run_number }}.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: QarentenApp beta ${{ github.run_number }}
          prerelease: true
          files: QarentenApp-beta-${{ github.run_number }}.apk
          body: |
            Beta de prueba. Bajá el .apk desde el celular e instalalo.
            Commit: ${{ github.sha }}
