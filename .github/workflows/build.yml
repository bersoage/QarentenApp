name: Compilar beta

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --console=plain 2>&1 | tee build.log

      - name: Renombrar
        run: |
          cp app/build/outputs/apk/release/app-release.apk QarentenApp-beta-${{ github.run_number }}.apk
          cp app/build/outputs/apk/release/app-release.apk QarentenApp.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: QarentenApp beta ${{ github.run_number }}
          prerelease: false
          make_latest: true
          files: |
            QarentenApp-beta-${{ github.run_number }}.apk
            QarentenApp.apk
          body: |
            Beta de prueba. Bajá el .apk desde el celular e instalalo encima de la anterior.
            Commit: ${{ github.sha }}

      # Si falla, se publica el registro de errores para poder revisarlo
      - name: Resumir errores
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log > errores.txt || cp build.log errores.txt

      - name: Publicar registro de errores
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-log-${{ github.run_number }}
          name: Error de compilación ${{ github.run_number }}
          prerelease: true
          files: |
            errores.txt
            build.log
